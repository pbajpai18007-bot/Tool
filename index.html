<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chill Zone 🎧</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f111a;
      --card-bg: rgba(25, 28, 44, 0.7);
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: radial-gradient(circle at 20% 20%, #1e1b4b, var(--bg-dark));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.2rem;
      background: linear-gradient(45deg, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1100px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      display: flex;
      flex-direction: column;
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Music Section */
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    .player-box {
      width: 100%;
      height: 220px;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      margin-top: 10px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Meme Section */
    .meme-box {
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(0,0,0,0.2);
      padding: 10px;
    }

    .meme-box img {
      max-width: 100%;
      max-height: 250px;
      object-fit: contain;
      border-radius: 8px;
    }

    .meme-title {
      font-size: 0.9rem;
      margin-top: 10px;
      color: var(--text-muted);
      text-align: center;
    }

    /* AI Chat Section */
    .chat-box {
      height: 220px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.88rem;
    }

    .msg {
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.4;
    }

    .msg.bot {
      background: rgba(139, 92, 246, 0.2);
      border-left: 3px solid var(--accent);
      align-self: flex-start;
    }

    .msg.user {
      background: rgba(255, 255, 255, 0.1);
      align-self: flex-end;
    }
  </style>
</head>
<body>

  <header>
    <h1>Vibe Lounge & Chill Zone 🎧</h1>
    <p>Music lagao, memes scroll karo aur chill karo!</p>
  </header>

  <div class="container">
    
    <!-- Music Player Card -->
    <div class="card">
      <h2>🎵 Song Player</h2>
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">
        YouTube video link ya Video ID daalo:
      </p>
      <div class="input-group">
        <input type="text" id="songInput" placeholder="Paste YouTube Link or Video ID...">
        <button onclick="playSong()">Play</button>
      </div>
      <div class="player-box">
        <iframe id="videoPlayer" 
          src="https://www.youtube.com/embed/jfKfPfyJRdk" 
          allow="autoplay; encrypted-media" allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- Live Meme Card -->
    <div class="card">
      <h2>😂 Meme Feed</h2>
      <div class="meme-box" id="memeBox">
        <p id="memeLoading">Loading fresh meme...</p>
        <img id="memeImg" src="" alt="Meme" style="display:none;">
        <div id="memeTitle" class="meme-title"></div>
      </div>
      <button style="margin-top: 12px; width: 100%;" onclick="fetchMeme()">Next Meme ⚡</button>
    </div>

    <!-- AI Chill Bot Card -->
    <div class="card">
      <h2>✨ AI Mood Buddy</h2>
      <div class="chat-box" id="chatBox">
        <div class="msg bot">Yo! Kaisa mood hai aaj? Song recommendation chahiye ya bass bakchodi karni hai? 🎧</div>
      </div>
      <div class="input-group">
        <input type="text" id="userInput" placeholder="Kuch bolo AI ko..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

  </div>

  <script>
    // 1. MUSIC PLAYER LOGIC
    function playSong() {
      const input = document.getElementById('songInput').value.trim();
      let videoId = '';

      if (input.includes('watch?v=')) {
        videoId = input.split('watch?v=')[1].split('&')[0];
      } else if (input.includes('youtu.be/')) {
        videoId = input.split('youtu.be/')[1].split('?')[0];
      } else {
        videoId = input; // If already an ID
      }

      if (videoId) {
        document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      } else {
        alert('Valid YouTube URL ya Video ID paste karo!');
      }
    }

    // 2. LIVE MEME FETCH LOGIC (Public Meme API)
    async function fetchMeme() {
      const memeImg = document.getElementById('memeImg');
      const memeTitle = document.getElementById('memeTitle');
      const memeLoading = document.getElementById('memeLoading');

      memeLoading.style.display = 'block';
      memeLoading.innerText = 'Fetching fresh meme...';
      memeImg.style.display = 'none';
      memeTitle.innerText = '';

      try {
        const res = await fetch('https://meme-api.com/gimme');
        const data = await res.json();
        
        memeImg.src = data.url;
        memeTitle.innerText = data.title;
        memeImg.onload = () => {
          memeLoading.style.display = 'none';
          memeImg.style.display = 'block';
        };
      } catch (err) {
        memeLoading.innerText = 'Meme load nahi hua, dobara click karo!';
      }
    }

    // 3. AI CHAT LOGIC (Client-side Chill Bot Simulation / API ready)
    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');

      // User Message
      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.innerText = text;
      chatBox.appendChild(userDiv);
      input.value = '';

      // AI Response Logic (Chill responses)
      setTimeout(() => {
        const botDiv = document.createElement('div');
        botDiv.className = 'msg bot';
        botDiv.innerText = getChillResponse(text);
        chatBox.appendChild(botDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 500);

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getChillResponse(msg) {
      const low = msg.toLowerCase();
      if (low.includes('song') || low.includes('gana')) {
        return "Lo-Fi beats ya fast hip-hop laga lo, side wale player me mast bajega!";
      } else if (low.includes('bore') || low.includes('bored')) {
        return "Bore mat ho bhai! 'Next Meme' click karo do-chaar solid meme dekh ke hass lo.";
      } else if (low.includes('hi') || low.includes('hello')) {
        return "Arre bro! Kya scene? Ekdum chill mode on rakho.";
      } else {
        const vibes = [
          "Mast vibe chal rahi hai, chill karo!",
          "Sahi baat hai, bas music chalne do tension mat lo.",
          "Life me chill bohot zaroori hai dost ☕",
          "Next meme dekha kya? Kaafi funny tha!"
        ];
        return vibes[Math.floor(Math.random() * vibes.length)];
      }
    }

    // Initial Meme load on page open
    window.onload = () => {
      fetchMeme();
    };
  </script>
</body>
</html>
