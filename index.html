<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chill Zone 🎧</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0d17;
      --card-bg: rgba(22, 27, 46, 0.75);
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: radial-gradient(circle at 15% 15%, #1e1b4b, var(--bg-dark));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(45deg, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1100px;
      flex: 1;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Music Section */
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      outline: none;
      font-size: 0.9rem;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .player-box {
      width: 100%;
      height: 240px;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      margin-top: 5px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Meme Section */
    .meme-box {
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(0,0,0,0.3);
      padding: 10px;
    }

    .meme-box img {
      max-width: 100%;
      max-height: 250px;
      object-fit: contain;
      border-radius: 8px;
    }

    .meme-title {
      font-size: 0.88rem;
      margin-top: 10px;
      color: var(--text-muted);
      text-align: center;
      font-weight: 500;
    }

    /* AI Chat Section */
    .chat-box {
      height: 240px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.88rem;
    }

    .msg {
      padding: 9px 13px;
      border-radius: 8px;
      max-width: 82%;
      line-height: 1.4;
    }

    .msg.bot {
      background: rgba(139, 92, 246, 0.25);
      border-left: 3px solid var(--accent);
      align-self: flex-start;
    }

    .msg.user {
      background: rgba(255, 255, 255, 0.12);
      align-self: flex-end;
    }

    /* Footer Signature */
    footer {
      margin-top: 35px;
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    footer span.author {
      color: #f472b6;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(244, 114, 182, 0.4);
    }
  </style>
</head>
<body>

  <header>
    <h1>Vibe Lounge & Chill Zone 🎧</h1>
    <p>Music search karo, Indian memes dekho aur chill karo!</p>
  </header>

  <div class="container">
    
    <!-- Music Player Card -->
    <div class="card">
      <h2>🎵 Search & Play Music</h2>
      <div class="input-group">
        <input type="text" id="songQuery" placeholder="Koi bhi song search karo (e.g. Arijit Singh Lofi)..." onkeypress="handleSongKey(event)">
        <button onclick="searchAndPlay()">Search & Play</button>
      </div>
      <div class="player-box">
        <iframe id="videoPlayer" 
          src="https://www.youtube.com/embed?listType=search&list=lofi%20hindi%20chill%20songs" 
          allow="autoplay; encrypted-media" allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- Indian Memes Card -->
    <div class="card">
      <h2>🇮🇳 Desi Memes</h2>
      <div class="meme-box" id="memeBox">
        <p id="memeLoading">Fresh Desi Meme aa raha hai...</p>
        <img id="memeImg" src="" alt="Desi Meme" style="display:none;">
        <div id="memeTitle" class="meme-title"></div>
      </div>
      <button style="margin-top: 12px; width: 100%;" onclick="fetchDesiMeme()">Next Meme 😂</button>
    </div>

    <!-- AI Chill Bot Card -->
    <div class="card">
      <h2>✨ AI Mood Buddy</h2>
      <div class="chat-box" id="chatBox">
        <div class="msg bot">Yo Prakhar! Kaisa scene hai? Gaana search karo ya koi solid meme dekh kar stress bhagao! 🎧</div>
      </div>
      <div class="input-group">
        <input type="text" id="userInput" placeholder="AI se kuch pucho ya baat karo..." onkeypress="handleChatKey(event)">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

  </div>

  <!-- Signature Footer -->
  <footer>
    Made with ❤️ by <span class="author">Prakhar</span>
  </footer>

  <script>
    // 1. MUSIC SEARCH & PLAY LOGIC
    function handleSongKey(e) {
      if (e.key === 'Enter') searchAndPlay();
    }

    function searchAndPlay() {
      const query = document.getElementById('songQuery').value.trim();
      const player = document.getElementById('videoPlayer');

      if (!query) {
        alert('Pehle koi song ka naam ya artist likho!');
        return;
      }

      // Check if user directly pasted a YouTube URL
      if (query.includes('youtube.com') || query.includes('youtu.be')) {
        let videoId = '';
        if (query.includes('watch?v=')) {
          videoId = query.split('watch?v=')[1].split('&')[0];
        } else if (query.includes('youtu.be/')) {
          videoId = query.split('youtu.be/')[1].split('?')[0];
        }
        if (videoId) {
          player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
          return;
        }
      }

      // Direct YouTube Search Embed query
      const encodedQuery = encodeURIComponent(query);
      player.src = `https://www.youtube.com/embed?listType=search&list=${encodedQuery}&autoplay=1`;
    }

    // 2. INDIAN MEME FETCH LOGIC
    const indianSubreddits = ['IndianDankMemes', 'DesiMemeCentral', 'IndianMeyMeys'];

    async function fetchDesiMeme() {
      const memeImg = document.getElementById('memeImg');
      const memeTitle = document.getElementById('memeTitle');
      const memeLoading = document.getElementById('memeLoading');

      memeLoading.style.display = 'block';
      memeLoading.innerText = 'Desi meme fetch ho raha hai...';
      memeImg.style.display = 'none';
      memeTitle.innerText = '';

      // Random Indian subreddit select karna
      const randomSub = indianSubreddits[Math.floor(Math.random() * indianSubreddits.length)];

      try {
        const res = await fetch(`https://meme-api.com/gimme/${randomSub}`);
        const data = await res.json();
        
        if (data.url) {
          memeImg.src = data.url;
          memeTitle.innerText = data.title || "Desi Tadka Meme";
          memeImg.onload = () => {
            memeLoading.style.display = 'none';
            memeImg.style.display = 'block';
          };
        } else {
          fallbackMeme();
        }
      } catch (err) {
        fallbackMeme();
      }
    }

    async function fallbackMeme() {
      try {
        const res = await fetch('https://meme-api.com/gimme');
        const data = await res.json();
        const memeImg = document.getElementById('memeImg');
        const memeTitle = document.getElementById('memeTitle');
        const memeLoading = document.getElementById('memeLoading');

        memeImg.src = data.url;
        memeTitle.innerText = data.title;
        memeLoading.style.display = 'none';
        memeImg.style.display = 'block';
      } catch {
        document.getElementById('memeLoading').innerText = 'Meme load nahi hua, "Next Meme" dabayein!';
      }
    }

    // 3. AI CHAT LOGIC
    function handleChatKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');

      // User Message
      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.innerText = text;
      chatBox.appendChild(userDiv);
      input.value = '';

      // AI Response Logic
      setTimeout(() => {
        const botDiv = document.createElement('div');
        botDiv.className = 'msg bot';
        botDiv.innerText = getChillResponse(text);
        chatBox.appendChild(botDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 450);

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getChillResponse(msg) {
      const low = msg.toLowerCase();
      if (low.includes('song') || low.includes('gana')) {
        return "Left wale box me search karo na koi mast track—Lofi beats ya rap!";
      } else if (low.includes('meme') || low.includes('hasao')) {
        return "Bhai 'Next Meme' click karo, ek se badhkar ek desi memes aayenge!";
      } else if (low.includes('hi') || low.includes('hello') || low.includes('hey')) {
        return "Arre brother! Kaisa chal raha hai sab? Ekdum full vibe mode on rakho.";
      } else {
        const chillQuotes = [
          "Bole toh ekdum rapchik mahol hai dost!",
          "Bas mast gaana bajao aur tension ko sideline karo.",
          "Life me break aur chill utna hi zaroori hai jitna chai ☕",
          "Next meme dekha kya? Hilarious tha bhai!"
        ];
        return chillQuotes[Math.floor(Math.random() * chillQuotes.length)];
      }
    }

    // Load initial meme on page load
    window.onload = () => {
      fetchDesiMeme();
    };
  </script>
</body>
</html>
