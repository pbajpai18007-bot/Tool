<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CreatorForge - All-in-One Web Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Navbar -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-lg">⚡</div>
        <span class="font-extrabold text-lg tracking-wider bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">CreatorForge</span>
      </div>
      <div class="flex gap-2">
        <button onclick="switchTab('studio')" class="tab-btn px-3 py-1.5 rounded-md text-sm font-medium bg-indigo-600 text-white" id="tab-studio">Graphics Lab</button>
        <button onclick="switchTab('simulator')" class="tab-btn px-3 py-1.5 rounded-md text-sm font-medium hover:bg-slate-800 text-slate-300" id="tab-simulator">Odds & Matrix</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto p-6 flex-1 w-full">
    
    <!-- Tab 1: Fast Social Graphics Studio -->
    <section id="view-studio" class="grid md:grid-cols-3 gap-6">
      <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 space-y-4">
        <h2 class="text-lg font-bold text-white border-b border-slate-800 pb-2">Poster / Banner Engine</h2>
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Headline Text</label>
          <input type="text" id="canvasText" value="ULTIMATE SHOWDOWN" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-indigo-500 outline-none" oninput="renderCanvas()" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Subhead</label>
          <input type="text" id="canvasSub" value="High Stakes • Matchday Analysis" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-indigo-500 outline-none" oninput="renderCanvas()" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold text-slate-400">Accent Color</label>
            <input type="color" id="accentColor" value="#6366f1" class="w-full h-10 rounded cursor-pointer bg-slate-950 border border-slate-700 mt-1" oninput="renderCanvas()" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-400">Layout</label>
            <select id="canvasAspect" class="w-full h-10 mt-1 bg-slate-950 border border-slate-700 rounded text-sm px-2" onchange="renderCanvas()">
              <option value="landscape">16:9 Banner</option>
              <option value="square">1:1 Square</option>
            </select>
          </div>
        </div>
        <button onclick="downloadCanvas()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold text-sm transition">Download Ultra-HD PNG</button>
      </div>

      <div class="md:col-span-2 bg-slate-900 p-5 rounded-xl border border-slate-800 flex items-center justify-center min-h-[360px] overflow-hidden">
        <canvas id="mainCanvas" width="800" height="450" class="max-w-full rounded-lg shadow-2xl border border-slate-700/50"></canvas>
      </div>
    </section>

    <!-- Tab 2: Strategy & Matrix Simulator -->
    <section id="view-simulator" class="hidden space-y-6">
      <div class="bg-slate-900 p-6 rounded-xl border border-slate-800">
        <h2 class="text-xl font-bold mb-2">Strategy Outcome & Risk Matrix</h2>
        <p class="text-sm text-slate-400 mb-6">Calculate projection weightages, risk-reward ratios, and high-impact combinations.</p>
        
        <div class="grid md:grid-cols-3 gap-6">
          <div class="bg-slate-950 p-4 rounded-lg border border-slate-800">
            <label class="text-sm font-semibold">Base Success Probability: <span id="probVal">65%</span></label>
            <input type="range" id="probRange" min="10" max="95" value="65" class="w-full mt-2" oninput="calcMatrix()" />
          </div>
          <div class="bg-slate-950 p-4 rounded-lg border border-slate-800">
            <label class="text-sm font-semibold">Differential Variance: <span id="varVal">1.5x</span></label>
            <input type="range" id="varRange" min="10" max="30" value="15" class="w-full mt-2" oninput="calcMatrix()" />
          </div>
          <div class="bg-slate-950 p-4 rounded-lg border border-slate-800 flex flex-col justify-center">
            <span class="text-xs text-slate-400 uppercase">Calculated Alpha Score</span>
            <span id="alphaResult" class="text-3xl font-black text-indigo-400 mt-1">--</span>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    function switchTab(tab) {
      document.getElementById('view-studio').classList.toggle('hidden', tab !== 'studio');
      document.getElementById('view-simulator').classList.toggle('hidden', tab !== 'simulator');
      document.getElementById('tab-studio').className = tab === 'studio' ? 'px-3 py-1.5 rounded-md text-sm font-medium bg-indigo-600 text-white' : 'px-3 py-1.5 rounded-md text-sm font-medium hover:bg-slate-800 text-slate-300';
      document.getElementById('tab-simulator').className = tab === 'simulator' ? 'px-3 py-1.5 rounded-md text-sm font-medium bg-indigo-600 text-white' : 'px-3 py-1.5 rounded-md text-sm font-medium hover:bg-slate-800 text-slate-300';
      if(tab === 'simulator') calcMatrix();
    }

    function renderCanvas() {
      const canvas = document.getElementById('mainCanvas');
      const ctx = canvas.getContext('2d');
      const text = document.getElementById('canvasText').value || 'YOUR TITLE';
      const sub = document.getElementById('canvasSub').value || '';
      const color = document.getElementById('accentColor').value;
      const aspect = document.getElementById('canvasAspect').value;

      canvas.width = aspect === 'square' ? 600 : 800;
      canvas.height = aspect === 'square' ? 600 : 450;

      // Dark background gradient
      const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      bgGrad.addColorStop(0, '#090d16');
      bgGrad.addColorStop(1, '#020617');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Glow circle
      const radial = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 10, canvas.width / 2, canvas.height / 2, canvas.width * 0.45);
      radial.addColorStop(0, color + '55');
      radial.addColorStop(1, 'transparent');
      ctx.fillStyle = radial;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Text styling
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 38px system-ui, sans-serif';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 10);

      ctx.fillStyle = color;
      ctx.font = '600 18px system-ui, sans-serif';
      ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 35);
    }

    function downloadCanvas() {
      const link = document.createElement('a');
      link.download = 'creator-export.png';
      link.href = document.getElementById('mainCanvas').toDataURL();
      link.click();
    }

    function calcMatrix() {
      const prob = parseInt(document.getElementById('probRange').value);
      const variance = (parseInt(document.getElementById('varRange').value) / 10).toFixed(1);
      document.getElementById('probVal').innerText = prob + '%';
      document.getElementById('varVal').innerText = variance + 'x';
      
      const alpha = Math.round((prob * 1.8) * variance);
      document.getElementById('alphaResult').innerText = alpha + ' PTS';
    }

    window.onload = () => { renderCanvas(); calcMatrix(); };
  </script>
</body>
</html>
